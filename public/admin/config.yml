backend:
  name: git-gateway
  branch: main

media_folder: "public/assets/images"
public_folder: "assets/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/home.md"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Text", name: "hero", widget: "text"}