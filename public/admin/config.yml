backend:
  name: github
  repo: ExpressBoda/expressboda-new
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/data/en.json"
        label: "Home Page (English)"
        name: "home_en"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Secondary CTA Button", name: "secondary_cta", widget: "string" }
              - { label: "Perks List", name: "perks", widget: "list" }

          - label: "Trust Banner"
            name: "trust_banner"
            widget: "object"
            fields:
              - label: "Item 1"
                name: "item1"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Item 2"
                name: "item2"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Item 3"
                name: "item3"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Item 4"
                name: "item4"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string" }

          - label: "Pain Points Section"
            name: "pain_points"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }

          - label: "Pricing Section"
            name: "pricing"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }

          - label: "Steps Section"
            name: "steps"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }

          - label: "FAQ Section"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }